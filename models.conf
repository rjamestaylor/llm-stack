# LLM Stack Model Registry
# Single source of truth for models you actively manage via Ollama.
#
# Format:  name|description|tags
# Tags:    default, reasoning, coding, image (comma-separated, no spaces)
#
# The first model tagged "default" is used when no model is specified.
# Lines starting with # are comments. Blank lines are ignored.

qwen3.5:35b       | Qwen 3.5 35B – balanced quality/speed             | reasoning
qwen3.5:122b      | Qwen 3.5 122B – max quality, slow                 | reasoning
gpt-oss:120b      | GPT OSS 120B                                       | reasoning

# Non-Ollama models (tracked here for reference, not managed by ollama)
# z-image | Tongyi Z-Image diffusion model | image
# path: ~/models/z-image/z-image-model

# MLX models (via mlx-lm, configured in mlx.conf)
qwen3.5-27b-opus-distilled-8bit | Qwen 3.5 27B Opus Distilled 8-bit | default, reasoning, coding
