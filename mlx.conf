# MLX Server Configuration
# Sourced by scripts/start-mlx.sh — bash variable assignments only.
# Run "gollm mlx restart" after editing.

# ── Model ─────────────────────────────────────────────────────────────────────
# HuggingFace repo or local path to an MLX-format model.
# mlx-community has pre-built quantizations for most popular models.
# MLX_MODEL="mlx-community/Qwen3.5-27B-Claude-4.6-Opus-Distilled-MLX-4bit"

# Local 8-bit conversion (higher quality than 4-bit, ~27GB):
MLX_MODEL="$HOME/models/mlx/qwen3.5-27b-opus-distilled-8bit"

# ── Server ────────────────────────────────────────────────────────────────────
MLX_HOST="0.0.0.0"   # 0.0.0.0 required for Docker (Open WebUI) to reach the host
MLX_PORT="8080"

# ── Generation ────────────────────────────────────────────────────────────────
MLX_MAX_TOKENS="32768"   # Max output tokens per response. Qwen3.5 native max = 32768.
MLX_TEMP="0.7"           # Sampling temperature. 0.0 = deterministic/greedy.

# ── Thinking mode (Qwen3 reasoning) ──────────────────────────────────────────
# "true"  = model shows <think>...</think> reasoning traces (slower, more thorough)
# "false" = skip thinking, respond directly (faster)
MLX_THINKING="true"

# ── KV Cache (context memory) ─────────────────────────────────────────────────
# With 128GB unified memory these can be generous.
# prompt-cache-size: number of distinct conversation KV caches to keep in memory
# prompt-cache-bytes: total bytes across all caches (12GB = 12884901888)
MLX_PROMPT_CACHE_SIZE="8"
MLX_PROMPT_CACHE_BYTES="12884901888"

# ── Speculative decoding (optional speed boost) ───────────────────────────────
# A small fast draft model predicts ahead; the main model verifies.
# Typically 2-4x faster generation. Requires a compatible draft model.
# Uncomment to enable:
# MLX_DRAFT_MODEL="mlx-community/Qwen3.5-1.7B-4bit"
# MLX_DRAFT_TOKENS="5"
MLX_DRAFT_MODEL=""
MLX_DRAFT_TOKENS="5"
